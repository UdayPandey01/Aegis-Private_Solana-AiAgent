[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
methods = { path = "../methods" }
shared = { path = "../../shared" }
risc0-zkvm = { version = "3.0.3", default-features = false, features = ["prove"]}
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anchor-client = { version = "0.31.1", features = ["async"]}
tokio = { version = "1.42.0", features = ["macros"] }
tracing = "0.1.41"
borsh = { version = "0.10.3" }
hex = "0.4"
bytemuck = "1.16.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
bincode = "1.3"
solana-client = "1.18.16"
solana-program = "1.18.16"
anchor-lang = "0.30.1"
spl-token = "4.0.1"

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/ivs/curve25519-dalek", branch = "rustls-dep-hell" }